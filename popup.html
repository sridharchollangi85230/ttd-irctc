<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>IRCTC Passenger Autofill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>IRCTC Passenger Autofill</h2>
  <div class="sub">Local passenger profiles</div>
  <label for="profileSelect">Passenger profile</label>
  <select id="profileSelect"></select>
  <button id="fillAllBtn" class="primary">Add &amp; Fill All Passengers</button>
  <button id="existingPassengerBtn">Select Existing Passenger</button>
  <button id="saveBtn">Save Profile</button>
  <button id="newBtn">New Profile</button>
  <div id="status" class="status">Ready</div>
  <details open>
    <summary>Passenger details</summary>
    <label for="profileName">Profile name</label>
    <input id="profileName" placeholder="Family passengers">
    <div id="passengers"></div>
    <button id="addPassengerBtn">+ Add Passenger</button>
  </details>
  <fieldset class="preferences">
    <legend>IRCTC booking preferences</legend>
    <label class="check-row"><input id="autoUpgrade" type="checkbox"><span>Consider for Auto Upgradation</span></label>
    <label class="check-row"><input id="confirmedBerths" type="checkbox"><span>Book only if confirm berths are allotted.</span></label>
    <p class="note">Select these here to select them on the IRCTC form.</p>
  </fieldset>
  <p class="note">Review all details before continuing. CAPTCHA, payment, and final booking are not automated.</p>
  <script src="popup.js"></script>
</body>
</html>
